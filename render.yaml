services:
  - type: web
    name: mg-appstore-backend
    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: ADMIN_NAME
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false
